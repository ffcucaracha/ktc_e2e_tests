name: ktc_e2e_tests

services:
  selenium:
    image: selenium/standalone-chrome:4.27.0
    shm_size: 2gb
    ports:
      - "${SELENIUM_HOST_PORT:-4444}:4444"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4444/status | grep -q '\"ready\": true'"]
      interval: 5s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: .
    environment:
      E2E_BASE_URL: ${E2E_BASE_URL:-http://frontend:5173}
      E2E_OPERATOR_USERNAME: ${E2E_OPERATOR_USERNAME:-e2e-operator}
      E2E_OPERATOR_PASSWORD: ${E2E_OPERATOR_PASSWORD:-change-me-e2e-operator-password}
      E2E_SCREENSHOT_DIR: ${E2E_SCREENSHOT_DIR:-/tests/artifacts/screenshots}
      SELENIUM_REMOTE_URL: ${SELENIUM_REMOTE_URL:-http://selenium:4444/wd/hub}
    volumes:
      - ./artifacts:/tests/artifacts
    depends_on:
      selenium:
        condition: service_healthy

networks:
  default:
    name: ktc_frontend_default
    external: true
