name: ktc_e2e_tests

services:
  selenium:
    image: selenium/standalone-chrome:4.27.0
    shm_size: 2gb
    ports:
      - "${SELENIUM_HOST_PORT:-4444}:4444"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4444/status | grep -q '\"ready\": true'"]
      interval: 5s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: .
    command: ["pytest", "-q", "-m", "not data_collection"]
    environment:
      E2E_BASE_URL: ${E2E_BASE_URL:-http://frontend:5173}
      E2E_API_BASE_URL: ${E2E_API_BASE_URL:-http://backend:8000/api/v1}
      E2E_OPERATOR_USERNAME: ${E2E_OPERATOR_USERNAME:-e2e-operator}
      E2E_OPERATOR_PASSWORD: ${E2E_OPERATOR_PASSWORD:-change-me-e2e-operator-password}
      E2E_SCREENSHOT_DIR: ${E2E_SCREENSHOT_DIR:-/tests/artifacts/screenshots}
      E2E_TRAINING_MANIFEST: ${E2E_TRAINING_MANIFEST:-/tests/artifacts/training-data-runs.jsonl}
      E2E_DATASET_RUNS: ${E2E_DATASET_RUNS:-5}
      E2E_RANDOM_SEED: ${E2E_RANDOM_SEED:-}
      E2E_MIN_ACTION_DELAY_SECONDS: ${E2E_MIN_ACTION_DELAY_SECONDS:-0.4}
      E2E_MAX_ACTION_DELAY_SECONDS: ${E2E_MAX_ACTION_DELAY_SECONDS:-1.4}
      E2E_SETTLE_DELAY_SECONDS: ${E2E_SETTLE_DELAY_SECONDS:-2.2}
      E2E_SIMULATOR_CODE: ${E2E_SIMULATOR_CODE:-all}
      E2E_SCENARIO_CODES: ${E2E_SCENARIO_CODES:-oil-heating-basic-startup,oil-heating-basic-shutdown,oil-heating-flow-control,oil-heating-wrong-sequence-training,oil-heating-reaction-time-training,oil-heating-elou-integrated-startup,oil-heating-elou-drainage-control}
      E2E_LATE_ACTION_DELAY_SECONDS: ${E2E_LATE_ACTION_DELAY_SECONDS:-6.2}
      SELENIUM_REMOTE_URL: ${SELENIUM_REMOTE_URL:-http://selenium:4444/wd/hub}
    volumes:
      - .:/tests
    depends_on:
      selenium:
        condition: service_healthy

networks:
  default:
    name: ktc_frontend_default
    external: true
